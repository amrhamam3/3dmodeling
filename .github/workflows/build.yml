name: Build CubeStudio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Python مطلوب بواجهة CMake الرسمية لـ GLAD 2 (تشغّل
      # سكربت التوليد داخلياً أثناء cmake --build)
      # -------------------------------------------------
      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # -------------------------------------------------
      # jinja2 مطلوبة لمولّد GLAD 2 نفسه (يستخدمها داخلياً لتوليد
      # ملفات C أثناء cmake --build) - بدونها يفشل التوليد بخطأ
      # ModuleNotFoundError: No module named 'jinja2'
      # -------------------------------------------------
      - name: تثبيت متطلبات GLAD (Python)
        run: pip install jinja2

      # -------------------------------------------------
      # تثبيت تبعيات النظام (Linux فقط - مكتبات X11 لأجل GLFW)
      # -------------------------------------------------
      - name: تبعيات النظام (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev

      # -------------------------------------------------
      # إعداد وبناء المشروع عبر CMake
      # (يجلب GLFW / GLM / ImGui / GLAD تلقائياً عبر FetchContent)
      # -------------------------------------------------
      - name: إعداد CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: بناء المشروع
        run: cmake --build build --config Release

      # -------------------------------------------------
      # تجميع الناتج في مجلد ثابت "artifact/" بدل الاعتماد على
      # تخمين مكان الملف التنفيذي (يختلف بين لينكس وويندوز:
      # لينكس يضعه مباشرة في build/، وويندوز (Visual Studio
      # multi-config) يضعه في build/Release/) - نستخدم find
      # للبحث عنه أينما كان، ثم نطبع محتوى المجلد للتأكد بالسجلات.
      # -------------------------------------------------
      - name: تجهيز حزمة الإخراج
        shell: bash
        run: |
          mkdir -p artifact
          find build -maxdepth 3 -iname "CubeStudio*" -type f -exec cp -v {} artifact/ \;
          find build -maxdepth 3 -iname "shaders" -type d -exec cp -rv {} artifact/ \;
          find build -maxdepth 3 -iname "fonts" -type d -exec cp -rv {} artifact/ \;
          echo "--- محتوى artifact/ ---"
          ls -laR artifact

      - name: رفع الناتج
        uses: actions/upload-artifact@v4
        with:
          name: CubeStudio-${{ matrix.os }}
          path: artifact/**
          if-no-files-found: error
